[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gayatri-ai"
version = "3.0.1"
description = "Gayatri AI — Course-Independent Agentic AI Education Platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12,<3.13"
authors = [{name = "Gayatri Education"}]

dependencies = [
    "PySide6>=6.11.0",
    "llama-cpp-python>=0.3.0",
    "httpx>=0.27.0",
    "cryptography>=43.0.0",
    "pydantic>=2.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pyjwt>=2.8.0",
    "psutil>=5.9.0",
    "rank-bm25>=0.2.2",
    "pypdf>=4.0.0",
    "pymupdf>=1.24.0",
    "psycopg2-binary>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "ruff>=0.6.0",
]
cuda = [
    "llama-cpp-python[cuda]>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "core*", "central_platform*", "adapters*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "ANN", "S", "T20", "RUF"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
pythonpath = ["."]
markers = [
    "gui: tests that require Qt GUI or WebEngine display (Audit #TEST-003)",
    "headless: pure logic unit and integration tests that can run headless in CI",
    "slow: tests that take longer than 5 seconds",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:.*httpx.*:Warning",
    "ignore:.*starlette.*:Warning",
]

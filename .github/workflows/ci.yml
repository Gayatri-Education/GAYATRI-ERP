name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
      GAYATRI_ENV: test
      GAYATRI_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 xvfb libxkbcommon-x11-0 libxcb-cursor0
          sudo apt-get install -y --no-install-recommends libegl1-mesa libgl1-mesa-glx || true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Sanitize requirements and strip BOMs
        run: |
          python -c "from pathlib import Path; [p.write_text(p.read_text(encoding='utf-8-sig').replace('\ufeff', ''), encoding='utf-8') for p in Path('.').glob('requirements*.lock') if p.is_file()]"

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Verify dependency lock reconciliation
        run: |
          python scripts/verify_dependency_lock.py

      - name: Verify compilation hygiene
        run: |
          python -m compileall app core central_platform tests scripts

      - name: Initialize temporary database schema
        run: |
          python scripts/migrate_db.py up --db-path gayatri_local.db
          python scripts/migrate_db.py up --db-path test_ci.db

      - name: Run architecture guardrail suite
        run: |
          pytest -v tests/architecture

      - name: Run headless test suite
        env:
          QT_QPA_PLATFORM: offscreen
          GAYATRI_ENV: test
          GAYATRI_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
        run: |
          pytest -v -m "not gui"

